# nginx site for the public relay. certbot --nginx adds the TLS server block and the http→https
# redirect to this file. Only /v1/relay (WebSocket) and /healthz are served; everything else is 404.
map $http_upgrade $sikeoop_relay_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.sikeoop.modgert.online;

    location = /v1/relay {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sikeoop_relay_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
