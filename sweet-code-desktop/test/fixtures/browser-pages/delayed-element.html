<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>延迟出现的元素</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  button { padding: 8px 18px; font: inherit; }
  .slot { margin: 16px 0; padding: 12px; border: 1px dashed rgba(127,127,127,.4); border-radius: 8px; min-height: 40px; }
  #status { color: #2a7; }
  .hint { color: #888; font-size: 13px; }
</style>
</head>
<body>
  <h1>延迟出现的元素</h1>
  <p>自动化不该靠固定睡眠，而应「等某元素出现 / 某文字出现」。这里有两种延迟：</p>
  <ul>
    <li>页面加载 1.5 秒后，自动区自动冒出一个按钮。</li>
    <li>点「加载内容」后，异步区 1 秒后才出现可点按钮。</li>
  </ul>

  <h2>① 自动延迟出现</h2>
  <div class="slot" id="auto-slot" aria-live="polite">加载中…（1.5 秒后出现）</div>

  <h2>② 点击后延迟出现</h2>
  <button id="load-btn" type="button">加载内容</button>
  <div class="slot" id="async-slot" aria-live="polite">（尚未加载）</div>

  <p id="status"></p>

  <script>
    const status = document.getElementById("status");

    setTimeout(() => {
      const slot = document.getElementById("auto-slot");
      slot.textContent = "";
      const btn = document.createElement("button");
      btn.id = "auto-btn";
      btn.textContent = "我是延迟出现的按钮";
      btn.addEventListener("click", () => { status.textContent = "点到了自动延迟出现的按钮。"; });
      slot.appendChild(btn);
    }, 1500);

    document.getElementById("load-btn").addEventListener("click", () => {
      const slot = document.getElementById("async-slot");
      slot.textContent = "加载中…";
      setTimeout(() => {
        slot.textContent = "";
        const btn = document.createElement("button");
        btn.id = "async-btn";
        btn.textContent = "异步加载出来的按钮";
        btn.addEventListener("click", () => { status.textContent = "点到了异步加载出来的按钮。"; });
        slot.appendChild(btn);
      }, 1000);
    });
  </script>
</body>
</html>
