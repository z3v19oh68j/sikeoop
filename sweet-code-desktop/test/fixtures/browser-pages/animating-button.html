<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动画中的按钮</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .track { height: 60px; position: relative; margin: 20px 0; overflow: hidden; border: 1px solid rgba(127,127,127,.3); border-radius: 8px; }
  #mover {
    position: absolute; top: 12px; left: 0; padding: 8px 16px; font: inherit;
    animation: slide 2s ease-in-out infinite alternate;
  }
  #mover.stopped { animation: none; left: 12px; }
  @keyframes slide { from { left: 8px; } to { left: calc(100% - 120px); } }
  #status { color: #2a7; }
  button { font: inherit; }
</style>
</head>
<body>
  <h1>动画中的按钮</h1>
  <p>按钮一直在左右移动，位置每帧都在变。自动化在点击前应等它「连续两帧位置不变」，
     即等动画停。点「停下动画」后按钮位置固定，才稳定可点。</p>

  <div class="track">
    <button id="mover">移动的按钮</button>
  </div>
  <button id="stop">停下动画</button>
  <p id="status"></p>

  <script>
    const mover = document.getElementById("mover");
    const status = document.getElementById("status");
    mover.addEventListener("click", () => { status.textContent = "移动按钮被点到了。"; });
    document.getElementById("stop").addEventListener("click", () => {
      mover.classList.add("stopped");
      status.textContent = "动画已停，按钮位置固定。";
    });
  </script>
</body>
</html>
