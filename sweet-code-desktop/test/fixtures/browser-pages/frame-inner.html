<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>子帧</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  button { padding: 6px 12px; font: inherit; }
  input { padding: 5px 7px; font: inherit; }
  #echo { color: #2a7; }
  .origin { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <p class="origin">子帧来源：<span id="origin"></span></p>
  <p>我是 <strong id="who"></strong> 子帧里的内容。</p>
  <input id="frame-input" type="text" placeholder="子帧里的输入框" aria-label="子帧输入框">
  <button id="frame-btn">子帧里的按钮</button>
  <p id="echo"></p>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("who").textContent = params.get("who") || "未知";
    document.getElementById("origin").textContent = location.origin;
    document.getElementById("frame-btn").addEventListener("click", () => {
      const v = document.getElementById("frame-input").value;
      document.getElementById("echo").textContent = "子帧按钮被点了；输入值：" + v;
    });
  </script>
</body>
</html>
