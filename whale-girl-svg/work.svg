    <g filter="url(#shadow)"><path d="M117 374 Q118 365 129 365 H361 Q372 365 373 374 L360 426 H131Z" fill="#c6b4e8" class="ink"/><path d="M117 374 H373 L368 392 H122Z" fill="#dfd5f2" stroke="#8170a6" stroke-width="2"/><rect x="199" y="370" width="95" height="40" rx="7" fill="#473c62"/><rect x="204" y="375" width="85" height="28" rx="4" fill="#bfe8ee"/><path d="M216 395 Q245 373 278 393" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/><path d="M186 415 H307" stroke="#917cb9" stroke-width="3" stroke-linecap="round"/></g>
        <g class="workL"><path d="M191 324 Q171 333 163 356 Q160 369 177 375 L215 373 L225 351Z" fill="url(#dress)" class="ink"/><path d="M177 359 Q188 351 201 360 Q206 367 198 373 Q187 377 176 369Z" fill="url(#skin)" class="ink"/><path d="M180 363 l5 4 m1-7 6 5 m1-7 5 5" class="fine"/></g>
        <g class="workR"><path d="M299 323 Q323 333 331 355 Q337 369 319 376 L281 373 L269 350Z" fill="url(#dress)" class="ink"/><path d="M321 359 Q309 351 296 360 Q291 367 299 373 Q310 377 322 369Z" fill="url(#skin)" class="ink"/><path d="M316 363 l-5 4 m-1-7-6 5 m-1-7-5 5" class="fine"/></g>
    <g class="typing-key"><circle cx="205" cy="354" r="3" fill="#a48ccf"/><circle cx="278" cy="354" r="3" fill="#a48ccf"/></g>
    <!-- ears and face -->
    <g class="breathe">
    <path d="M169 195 Q145 183 148 211 Q152 230 173 226Z" fill="url(#skin)" class="ink"/><path d="M321 195 Q345 183 342 211 Q338 230 317 226Z" fill="url(#skin)" class="ink"/>
    <ellipse cx="245" cy="205" rx="84" ry="99" fill="url(#skin)" class="ink" filter="url(#shadow)"/>
    <path d="M164 199 Q175 144 214 126 Q267 102 315 144 Q337 165 329 204 Q318 178 302 170 Q287 193 268 198 Q247 201 233 177 Q215 200 188 201 Q177 201 164 199Z" fill="url(#hairShade)"/>
    <ellipse cx="184" cy="239" rx="25" ry="13" fill="url(#cheek)"/><ellipse cx="300" cy="239" rx="25" ry="13" fill="url(#cheek)"/>
    <g class="blink">
  <g transform="translate(205 218)"><path d="M-24 -9 Q0 -21 24 -8 Q24 18 4 23 Q-19 22 -24 -9Z" fill="#fff" class="ink"/><path d="M-21 -6 Q0 -17 20 -6 L18 1 Q0 8 -20 3Z" fill="#44345f"/><path d="M-18 1 Q0 -1 18 4 Q17 21 2 22 Q-14 21 -18 1Z" fill="url(#iris)" stroke="#655287" stroke-width="1.5"/><ellipse cx="-6" cy="7" rx="5" ry="7" fill="#fff"/><circle cx="9" cy="15" r="2" fill="#fff"/><path d="M-25 -9 Q-2 -23 24 -9" fill="none" class="ink" stroke-width="5"/></g>
  <g transform="translate(278 218)"><path d="M-24 -8 Q0 -19 24 -7 Q23 18 3 23 Q-18 22 -24 -8Z" fill="#fff" class="ink"/><path d="M-20 -5 Q0 -16 21 -5 L18 2 Q1 7 -20 3Z" fill="#44345f"/><path d="M-18 1 Q0 0 18 4 Q17 21 2 22 Q-14 21 -18 1Z" fill="url(#iris)" stroke="#655287" stroke-width="1.5"/><ellipse cx="-6" cy="7" rx="5" ry="7" fill="#fff"/><circle cx="9" cy="15" r="2" fill="#fff"/><path d="M-25 -8 Q-2 -21 24 -8" fill="none" class="ink" stroke-width="5"/></g>
</g>
    <path d="M241 237 Q246 234 250 237" fill="none" stroke="#bd8392" stroke-width="2" stroke-linecap="round"/>
    <path d="M232 256 Q242 264 253 256 Q246 270 235 264Z" fill="#bf6d81" stroke="#8b536c" stroke-width="1.5"/>
    <!-- long, layered fringe -->
