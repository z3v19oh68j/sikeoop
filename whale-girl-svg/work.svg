      <path d="M0 0 C-15 -21 -34 -5 -18 8 C-7 18 9 5 0 -8 C-8 -21 12 -28 20 -11 C28 7 5 18 -7 8 C-18 -1 -5 -16 8 -11 C22 -6 24 14 10 23" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 0 C-15 -21 -34 -5 -18 8 C-7 18 9 5 0 -8 C-8 -21 12 -28 20 -11 C28 7 5 18 -7 8 C-18 -1 -5 -16 8 -11 C22 -6 24 14 10 23" fill="none" class="ink" stroke-width="3"/>
      <path d="M14 23 L16 54 M3 21 L4 52" stroke="#8d78b6" stroke-width="2.5"/><path d="M3 27 L16 27 M4 34 L16 34" stroke="#c7b5eb" stroke-width="2"/>
      <path d="M2 50 L10 65 L18 50Z" fill="#dfd3fb" class="ink"/><circle cx="10" cy="35" r="4" fill="#fff" stroke="#8d78b6" stroke-width="1.5"/>
