    <path d="M160 264 Q151 290 137 296 Q145 278 143 265 Q137 294 123 302 Q133 283 126 270" fill="url(#hairShade)" class="ink"/>
    <path d="M354 256 Q365 280 385 286 Q368 273 371 259 Q381 282 397 285 Q380 269 383 254" fill="url(#hairShade)" class="ink"/>
    </g>
    <!-- neck and dress -->
    <path d="M221 291 Q223 321 213 333 L245 355 L278 331 Q266 312 272 291Z" fill="url(#skin)" class="ink"/>
    <path d="M181 324 Q201 306 221 309 L245 327 L270 307 Q292 310 310 327 Q328 350 324 387 L166 387 Q163 351 181 324Z" fill="url(#dress)" class="ink"/>
