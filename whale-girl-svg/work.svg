      <path d="M162 190 Q158 128 208 99 Q251 73 300 104 Q331 123 335 177 Q318 162 302 140 Q302 178 282 198 Q272 175 264 148 Q257 182 242 202 Q226 181 220 147 Q211 179 190 197 Q178 179 181 148 Q170 175 162 190Z" fill="url(#hair)" class="ink"/>
      <path d="M177 169 Q185 119 222 101 M196 185 Q210 134 235 113 M247 189 Q266 134 282 114 M291 175 Q304 144 302 128" fill="none" stroke="#c5b4ed" stroke-width="3" stroke-linecap="round"/>
