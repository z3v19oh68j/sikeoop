<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="title desc">
<title id="title">Working Whale Girl</title><desc id="desc">A looping vector animation of a white-haired chibi whale girl 干活的鲸鱼娘.</desc>

<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefe"/><stop offset=".55" stop-color="#f3efff"/><stop offset="1" stop-color="#d9caff"/></linearGradient>
  <linearGradient id="hairShade" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e9e0ff"/><stop offset="1" stop-color="#bda9f3"/></linearGradient>
  <linearGradient id="skin" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#fff8f2"/><stop offset="1" stop-color="#ffdccc"/></linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dfd5ff"/></linearGradient>
  <linearGradient id="fin" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#ede7ff"/><stop offset="1" stop-color="#c8b9f4"/></linearGradient>
  <radialGradient id="iris" cx=".5" cy=".28" r=".75"><stop stop-color="#d8caff"/><stop offset=".55" stop-color="#9880cf"/><stop offset="1" stop-color="#665486"/></radialGradient>
  <radialGradient id="cheek"><stop stop-color="#f7a2ad" stop-opacity=".55"/><stop offset="1" stop-color="#f7a2ad" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8170a6" flood-opacity=".18"/></filter>
  <style>
    .ink{stroke:#43345f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .fine{stroke:#8c78b7;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .softline{stroke:#c4b4eb;stroke-width:2;stroke-linecap:round;fill:none}
    .breathe{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .hair-sway{animation:sway 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
    .float{animation:float 3s ease-in-out infinite}
    .blink{animation:blink 4.7s infinite;transform-box:fill-box;transform-origin:center}
    .workL{animation:type 420ms ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .workR{animation:type 510ms ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:center}
    .slowbob{animation:slowbob 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .zfloat{animation:zfloat 2.2s ease-in-out infinite}
    .lazyarm{animation:lazyarm 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 80%}
    .typing-key{animation:key 520ms ease-in-out infinite alternate}
    @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
    @keyframes type{from{transform:translateY(0)}to{transform:translateY(4px)}}
    @keyframes slowbob{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(3px) rotate(2deg)}65%{transform:translateY(-2px) rotate(-1deg)}}
    @keyframes zfloat{0%{opacity:0;transform:translate(0,8px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(9px,-24px) scale(1.12)}}
    @keyframes lazyarm{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
    @keyframes key{0%{opacity:.4}100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:8s!important}}
  </style>
</defs>
<g aria-hidden="true">
  <ellipse cx="244" cy="435" rx="176" ry="19" fill="#e8e0f5" opacity=".6"/>
  <circle cx="92" cy="171" r="8" fill="#eee8fb"/><circle cx="389" cy="166" r="5" fill="#e8f6fa"/><circle cx="367" cy="310" r="7" fill="#f4efff"/><path d="M91 188 q7 -10 14 0 q-7 11 -14 0Z" fill="#fff" stroke="#c8b6eb" stroke-width="1.5"/>
  <g opacity=".9"><path d="M123 198 l7 -12 7 12 12 7 -12 7 -7 12 -7 -12 -12 -7Z" fill="#fff4b8" stroke="#d5b969" stroke-width="1.5"/><path d="M366 174 l4 -8 4 8 8 4 -8 4 -4 8 -4-8-8-4Z" fill="#fff4b8"/></g>
