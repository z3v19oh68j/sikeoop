<style>

.model.mimo { border-color: rgba(240,120,155,.6); }

.meter b { color: var(--ok); font-weight: 500; } .meter .y { font: 600 34px var(--mono); color: var(--ink); }

.tcard { position: absolute; width: 420px; padding: 20px 22px; border-radius: 16px; background: #1c1c20; border: 1px solid #2f2f35; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.tcard b { font: 700 22px var(--ui); display: block; margin-bottom: 8px; } .tcard p { font: 17px/1.6 var(--ui); color: var(--ink2); }

.tcard .ft span { padding: 6px 14px; border-radius: 8px; border: 1px solid #2f2f35; } .tcard .ft span.go { background: var(--ink); color: #121214; }

<script>
// ---- timeline -------------------------------------------------------------------------
const SCENES = [
  { id: "open", dur: 7.0, vo: 0.9 },
  { id: "browser", dur: 12.4, vo: 0.5 },
  { id: "markdown", dur: 7.2, vo: 0.5 },
  { id: "tour", dur: 8.3, vo: 0.5 },
  { id: "memory", dur: 9.0, vo: 0.5 },
  { id: "china", dur: 7.4, vo: 0.5 },
  { id: "end", dur: 7.6, vo: 0.9 },
];
const LINES = {
  open: "杂鱼，醒醒！sikeoop 4.1 来啦，本鲸亲自给你讲。",
  browser: "做网页不用再切窗口了。左边改代码，右边马上看到效果；本鲸还会自己点按钮、看控制台报错，测好了再交差。",
  markdown: "Markdown 文档一键切成预览，标题、表格、清单，排得整整齐齐。",
  tour: "第一次打开，本鲸手把手带你认路。不会就点问号，新手手册随便搜。",
  memory: "还有四层记忆：你的习惯、上次做到哪，本鲸都记着。杂鱼说过的蠢话，也记着哦。",
  china: "DeepSeek、通义千问、Kimi，国产模型直接连，花了多少按人民币算。",
  end: "sikeoop 4.1，去官网下载吧。哼，才不是特意在等你呢。",
};
let acc = 0;
for (const s of SCENES) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
// Sound effect cues, in scene-local seconds (the mixer reads window.PV.cues).
const CUE = {
  open: [[0.15, "glitch_004", 0.5], [0.3, "tick_001", 0.35], [0.45, "tick_002", 0.35], [0.6, "tick_001", 0.35], [0.75, "tick_004", 0.35], [1.1, "scroll_003", 0.45], [2.75, "confirmation_002", 0.6], [3.3, "glass_003", 0.45]],
  browser: [[0.05, "glitch_002", 0.45], [0.2, "maximize_006", 0.5], [1.2, "click_002", 0.25], [1.5, "click_003", 0.25], [1.8, "click_002", 0.25], [2.1, "click_005", 0.25], [3.2, "confirmation_001", 0.5], [6.5, "click_001", 0.7], [6.6, "drop_002", 0.45], [7.6, "open_002", 0.45], [8.6, "confirmation_003", 0.55], [9.4, "pluck_001", 0.5]],
  markdown: [[0.05, "glitch_001", 0.45], [0.8, "switch_003", 0.6], [1.5, "scroll_001", 0.4], [4.4, "tick_004", 0.4], [4.9, "tick_004", 0.4], [5.4, "confirmation_004", 0.5]],
  tour: [[0.05, "glitch_003", 0.45], [0.5, "select_002", 0.5], [2.2, "select_003", 0.5], [3.8, "select_004", 0.5], [5.2, "maximize_003", 0.5], [5.7, "click_004", 0.2], [5.85, "click_004", 0.2], [6.3, "question_002", 0.45]],
  memory: [[0.05, "glitch_002", 0.45], [0.4, "drop_001", 0.45], [0.75, "drop_003", 0.45], [1.1, "drop_001", 0.45], [1.45, "drop_004", 0.45], [3.0, "bong_001", 0.5], [4.6, "minimize_004", 0.5], [6.8, "pluck_002", 0.5]],
  china: [[0.05, "glitch_004", 0.45], [0.5, "toggle_001", 0.45], [0.8, "toggle_002", 0.45], [1.1, "toggle_003", 0.45], [1.4, "toggle_004", 0.45], [1.7, "toggle_001", 0.45], [2.0, "toggle_002", 0.45], [2.3, "toggle_003", 0.55], [3.8, "confirmation_002", 0.5]],
  end: [[0.05, "glitch_001", 0.55], [0.5, "maximize_009", 0.6], [1.6, "glass_005", 0.5], [2.4, "tick_002", 0.3], [3.4, "confirmation_004", 0.6]],
};
const cues = [];
for (const s of SCENES) for (const [t, file, gain] of CUE[s.id]) cues.push({ t: +(s.start + t).toFixed(3), file, gain });
window.PV = { total: TOTAL, scenes: SCENES.map((s) => ({ id: s.id, start: s.start, dur: s.dur, vo: s.start + s.vo })), cues };

// ---- helpers ----------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (i, s = 0) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const GLYPHS = "{}[]()<>/\\=+-*;:.,_|~^#$%&@!?01";
const pick = (set, i, s) => set[Math.floor(hash(i, s) * set.length) % set.length];
const typed = (str, k) => str.slice(0, Math.round(str.length * clamp(k)));
const HEART_SVG = (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="#f0789b" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21Z"/></svg>`;
const WHALE = (s = 26) => `<svg width="${s}" height="${s * 0.62}" viewBox="0 0 160 100"><path d="M28 56C16 50 8 40 4 30c10 2 16 8 20 14 0-10 4-18 12-22-2 12 0 22 6 30Z" fill="#7fb0e8"/><path d="M30 58c0-18 22-32 52-32 30 0 52 14 52 34 0 18-22 30-56 30-30 0-48-12-48-32Z" fill="#7fb0e8"/><path d="M40 70c10 10 26 14 42 14 22 0 40-6 48-18-8 6-26 10-46 10-18 0-32-2-44-6Z" fill="#dbe9fa"/><circle cx="112" cy="54" r="5" fill="#1a2a3e"/><ellipse cx="118" cy="66" rx="6" ry="3" fill="#f0789b" opacity="0.6"/></svg>`;
const CURSOR = `<svg class="cursor" viewBox="0 0 24 24" style="left:VARX;top:VARY"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 18Z" fill="#f0789b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const cursorAt = (x, y) => CURSOR.replace("VARX", `${x}px`).replace("VARY", `${y}px`);

function chrome(sc, t, num) {
  const k = eo(seg(t, 0.05, 0.5));
  const out = 1 - seg(t, sc.dur - 0.35, sc.dur);
  return `<div class="chip" style="opacity:${k * out};transform:translateX(${(1 - k) * -30}px)"><i>${num}</i><b>${sc.title}</b></div>` + subtitle(sc, t);
}
function subtitle(sc, t) {
  const line = LINES[sc.id];
  const a = clamp((t - sc.vo + 0.15) / 0.25) * (1 - seg(t, sc.dur - 0.3, sc.dur));
  if (a <= 0) return "";
  const html = line.replace(/本鲸|杂鱼/g, (m) => `<span class="w">${m}</span>`);
  return `<div class="sub" style="opacity:${a}">${html}</div>`;
}
function windowFrame(inner, t, title = "my-first-site") {
  const k = eo(seg(t, 0.05, 0.6));
  return `<div class="win" style="transform:translateY(${(1 - k) * 60}px) scale(${0.97 + 0.03 * k});opacity:${k}">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="heart">${HEART_SVG(16)}</span><span style="color:var(--ink)">sikeoop</span><span>/</span><span>${title}</span><span style="margin-left:auto;font-family:var(--mono)">v4.1</span></div>
    <div class="body">${inner}</div></div>`;
}

// ---- scenes ------------------------------------------------------------------------------
const TITLES = { browser: "内置浏览器", markdown: "Markdown 预览", tour: "新手教程 · 帮助手册", memory: "四层记忆", china: "为华人准备", end: "现在下载", open: "sikeoop 4.1" };
SCENES.forEach((s) => (s.title = TITLES[s.id]));

function sceneBrowser(sc, t) {
  // Code edit: #3b82f6 → #f0789b, typed 1.0–2.4; page updates at 3.2.
  const typedK = seg(t, 1.0, 2.4);
  const oldVal = "#3b82f6";
  const newVal = "#f0789b";
  const selecting = t > 0.7 && t < 1.0;
  const val = t < 1.0 ? oldVal : typed(newVal, typedK);
  const pink = t > 3.2;
  const flash = Math.max(0, 1 - Math.abs(t - 3.3) / 0.35);
  const lines = [
    `<span class="p">.add</span> {`,
    `  padding: 0 30px;`,
    `  border-radius: 12px;`,
    `  background: <span class="s" style="${selecting ? "background:rgba(240,120,155,.3)" : ""}">${val}</span>${t >= 1.0 && t < 2.6 ? '<span class="caret"></span>' : ""};`,
    `  color: <span class="s">white</span>;`,
    `}`,
    ``,
    `<span class="c">/* 每一笔 */</span>`,
    `<span class="p">.row</span> {`,
    `  display: flex;`,
    `  gap: 16px;`,
    `}`,
  ];
  const code = lines.map((l, i) => `<div class="ln"><span class="n">${i + 10}</span><span>${l}</span></div>`).join("");
  // AI clicks the button: cursor travels 4.5–6.4, click at 6.5, new row at 6.7.
  const cx = lerp(1180, 1010, eio(seg(t, 4.4, 6.3)));
  const cy = lerp(720, 440, eio(seg(t, 4.4, 6.3)));
  const showCursor = t > 4.2 && t < 9.8;
  const press = t > 6.45 && t < 6.6 ? 0.94 : 1;
  const rip = seg(t, 6.5, 7.2);
  const row = eo(seg(t, 6.7, 7.1));
  const consoleK = eo(seg(t, 7.5, 8.0));
  const okK = seg(t, 8.5, 8.7);
  const bubbleK = back(seg(t, 9.3, 9.75));
  const btnColor = pink ? "#f0789b" : "#3b82f6";
  const site = `
    <div class="site">
      <div style="font:700 34px var(--ui)">我的记账本</div>
      <div style="font:18px var(--ui);color:#776e75;margin:8px 0 26px">这个月已经花了 <b style="color:#1e1a1d">¥${row > 0.5 ? "1,265" : "1,240"}</b></div>
      <span class="btn" style="background:${btnColor};transform:scale(${press});box-shadow:0 0 0 ${flash * 12}px rgba(240,120,155,${flash * 0.35})">＋ 记一笔</span>
      <div style="margin-top:28px;display:grid;gap:12px;font:19px var(--ui)">
        <div style="opacity:${row};transform:translateY(${(1 - row) * -10}px);display:flex;justify-content:space-between;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid #eadfe4;width:560px"><span>午饭</span><span>¥25</span></div>
        <div style="display:flex;justify-content:space-between;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid #eadfe4;width:560px"><span>奶茶</span><span>¥18</span></div>
        <div style="display:flex;justify-content:space-between;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid #eadfe4;width:560px"><span>地铁</span><span>¥4</span></div>
      </div>
      ${rip > 0 && rip < 1 ? `<div class="ripple" style="left:${100 - rip * 40}px;top:${120 - rip * 40}px;width:${120 + rip * 80}px;height:${120 + rip * 80}px;opacity:${1 - rip}"></div>` : ""}
    </div>
    <div class="console" style="transform:translateY(${(1 - consoleK) * 150}px)">
      <div style="color:var(--muted)">控制台</div>
      <div>&gt; 点击「记一笔」… 新增 1 行</div>
      <div style="opacity:${okK};color:var(--ok)">✓ 0 个报错，0 个警告</div>
    </div>`;
  const inner = `
    <div class="act"><span></span><span class="on"></span><span></span><span></span></div>
    <div style="width:640px;border-right:1px solid #222226;position:relative">
      <div class="tabs"><span class="tab on">style.css</span><span class="tab">App.jsx</span></div>
      <div class="code">${code}</div>
    </div>
    <div style="flex:1;position:relative">
      <div class="tabs"><span class="tab on">🌐 浏览器</span></div>

// The opening: boot log, glyph rain gathering into the heart, "sikeoop 4.1" decoding.
const actx = document.getElementById("ascii").getContext("2d");
const CELLS = (() => {
  const out = [];
  const cw = 14, ch = 24, cx = 960, cy = 470, r = 260;
  for (let row = -14; row <= 14; row++) for (let col = -24; col <= 24; col++) {
    const x = cx + col * cw, y = cy + row * ch;
    const hx = (x - cx) / r, hy = -(y - cy) / r - 0.12;
    const a = hx * hx + hy * hy - 1, v = a * a * a - hx * hx * hy * hy * hy;
    if (v > 0) continue;
    const depth = Math.min(1, Math.pow(-v, 0.35) * 1.6);
    const i = out.length;
    const ang = hash(i, 3) * Math.PI * 2, far = 1100 + hash(i, 4) * 500;
    out.push({ x, y, depth, glyph: ".:-=+*x#%@"[Math.min(9, Math.floor(depth * 10))], sx: cx + Math.cos(ang) * far, sy: cy + Math.sin(ang) * far, land: 1.15 + Math.hypot(x - cx, y - cy) / r * 0.7 + hash(i, 5) * 0.25 });
  }
  return out;
})();
function drawOpen(t, sc) {
  actx.clearRect(0, 0, 1920, 1080);
  const fadeAll = 1 - seg(t, sc.dur - 0.35, sc.dur);
  actx.globalAlpha = fadeAll;
  actx.font = "22px GeistMono, monospace";
  // boot log
  const boot = ["sikeoop 4.1.0 · booting", "> 读取记忆 c1–c4 ............ ok", "> 打开内置浏览器 ............ ok", "> 唤醒鲸鱼娘 ................ 醒了"];
  const bootFade = 1 - seg(t, 1.6, 2.1);
  boot.forEach((line, n) => {
    const shown = typed(line, seg(t, 0.25 + n * 0.15, 0.4 + n * 0.15));
    if (!shown) return;
    actx.fillStyle = `rgba(139,139,147,${0.9 * bootFade * fadeAll})`;
    const ok = shown.endsWith("ok") || shown.endsWith("醒了");
    actx.fillText(ok ? shown.replace(/(ok|醒了)$/, "") : shown, 96, 110 + n * 38);
    if (ok) { actx.fillStyle = shown.endsWith("ok") ? `rgba(127,220,163,${bootFade * fadeAll})` : `rgba(240,120,155,${bootFade * fadeAll})`; actx.fillText(shown.endsWith("ok") ? "ok" : "醒了", 96 + actx.measureText(shown.replace(/(ok|醒了)$/, "")).width, 110 + n * 38); }
  });
  // glyph rain
  const rain = seg(t, 0.9, 1.3) * (1 - seg(t, 3.2, 3.8));
  if (rain > 0) {
    actx.fillStyle = `rgba(240,120,155,${0.16 * rain * fadeAll})`;
    const step = Math.floor(t * 14);
    for (let i = 0; i < 900; i++) {
      if (hash(i, step) < 0.55) continue;
      actx.fillText(pick(GLYPHS, i, step), Math.floor(hash(i, 1) * 137) * 14, Math.floor(hash(i, 2) * 45) * 24 + 24);
    }
  }
  // heart
  const step = Math.floor(t * 24);
  const beat = 1 + 0.06 * Math.sin(seg(t, 2.6, 2.9) * Math.PI);
  const glitch = (t > 2.95 && t < 3.02) || (t > 3.3 && t < 3.36);
  const draw = (dx, tint) => CELLS.forEach((c, i) => {
    const fly = seg(t, c.land - 0.45, c.land);
    if (fly <= 0) return;
    const k = eo(fly);
    let x = lerp(c.sx, c.x, k), y = lerp(c.sy, c.y, k);
    if (fly >= 1) { x = 960 + (x - 960) * beat; y = 470 + (y - 470) * beat; }
    const lit = Math.max(0, 1 - Math.abs((c.y - 200) / 560 - seg(t, 2.9, 3.4)) * 8);
    const d = Math.min(1, c.depth * 0.85 + lit);
    actx.fillStyle = tint || `rgba(${Math.round(240 + 15 * d)},${Math.round(120 + 106 * d)},${Math.round(155 + 81 * d)},${(0.25 + 0.75 * fly) * fadeAll})`;
    actx.fillText(fly >= 1 ? c.glyph : pick(GLYPHS, i, step), x - 7 + dx, y + 8);
  });
  if (glitch) { actx.globalCompositeOperation = "lighter"; draw(-6, "rgba(255,60,90,.55)"); draw(6, "rgba(60,220,255,.45)"); actx.globalCompositeOperation = "source-over"; } else draw(0);
  // wordmark
  if (t > 2.6) {
    const W = "sikeoop 4.1";
    let w = "";
    for (let i = 0; i < W.length; i++) { const lock = 2.75 + i * 0.05; w += t < lock - 0.25 ? " " : t >= lock ? W[i] : pick("!<>-_\\/[]{}=+*^?#", i, Math.floor(t * 30)); }
    actx.font = "400 96px QK, sans-serif";
    actx.textAlign = "center";
    actx.shadowColor = "rgba(240,120,155,.6)"; actx.shadowBlur = 30;
    actx.fillStyle = "#ffd6e3";
    actx.fillText(w, 960, 900);
    actx.shadowBlur = 0; actx.textAlign = "left";
  }
  actx.globalAlpha = 1;
  // scanlines
  actx.fillStyle = "rgba(0,0,0,.16)";
  for (let y = 0; y < 1080; y += 3) actx.fillRect(0, y, 1920, 1);
}

// ---- transitions: a short glitch wipe at each cut ----
function fx(t) {
  let out = "";
  for (const s of SCENES) {
    if (s.start === 0) continue;
    const d = t - s.start;
    if (d > -0.18 && d < 0.22) {
      const k = 1 - Math.abs(d) / 0.22;
      const bands = Array.from({ length: 7 }, (_, i) => {
        const y = Math.floor(hash(i, Math.floor(t * 40)) * 1080);
        const h = 10 + hash(i, 9) * 60;
        const dx = (hash(i, 7) - 0.5) * 120 * k;
        return `<div class="abs" style="left:0;right:0;top:${y}px;height:${h}px;background:rgba(240,120,155,${0.12 * k});transform:translateX(${dx}px);mix-blend-mode:screen"></div>`;
      }).join("");
      out += `<div class="abs" style="inset:0;background:rgba(11,11,14,${0.55 * k})"></div>${bands}`;
    }
  }
  // a faint vignette always
  out += `<div class="abs" style="inset:0;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45))"></div>`;
  return out;
}

  if (sc.id === "open") { drawOpen(lt, sc); stage.innerHTML = subtitle(sc, lt); }
  else stage.innerHTML = { browser: sceneBrowser, markdown: sceneMarkdown, tour: sceneTour, memory: sceneMemory, china: sceneChina, end: sceneEnd }[sc.id](sc, lt);
  document.getElementById("fx").innerHTML = fx(t);
};
