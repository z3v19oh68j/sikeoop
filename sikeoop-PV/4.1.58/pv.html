<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sikeoop 4.1.58 PV</title>
<style>
@font-face { font-family: "Geist"; src: url("fonts/geist.woff2"); font-weight: 100 900; }
@font-face { font-family: "GeistMono"; src: url("fonts/geist-mono.woff2"); font-weight: 100 900; }
:root {
  --bg: #0b0b0e; --panel: #151517; --panel2: #1c1c20; --line: #26262b; --line2: #2f2f35;
  --ink: #ecebef; --ink2: #c4c3cb; --muted: #8d8b96; --pink: #f0789b; --blue: #7fb0e8;
  --ok: #5fd38d; --warn: #e5a15b; --bad: #ef6b6b;
  --ui: "Geist", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: "GeistMono", "SF Mono", Menlo, "PingFang SC", monospace;
  --big: "PingFang SC", "Hiragino Sans GB", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
#bg, #stage, #fx, #glyph { position: absolute; inset: 0; }
#bg { background:
  radial-gradient(900px 600px at var(--gx, 70%) var(--gy, 20%), rgba(240,120,155,.14), transparent 70%),
  radial-gradient(800px 560px at 12% 92%, rgba(127,176,232,.09), transparent 70%), var(--bg); }
#bg::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 48px 48px; }
#fx { pointer-events: none; }
.abs { position: absolute; }
.chip { position: absolute; left: 96px; top: 64px; display: flex; align-items: center; gap: 18px; font: 500 22px/1 var(--mono); color: var(--muted); letter-spacing: .06em; }
.chip .act { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(240,120,155,.5); color: var(--pink); font: 600 20px/1 var(--big); letter-spacing: .1em; }
.chip .act.soon { border-color: rgba(229,161,91,.5); color: var(--warn); }
.chip .act.later { border-color: rgba(127,176,232,.5); color: var(--blue); }
.chip .act.meh { border-color: rgba(141,139,150,.6); color: var(--ink2); }
.chip b { font: 800 50px/1 var(--big); color: var(--ink); letter-spacing: .02em; }
.sub { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); padding: 12px 28px; border-radius: 14px; background: rgba(11,11,14,.8); border: 1px solid var(--line); font: 600 32px/1.45 var(--big); color: var(--ink); text-align: center; white-space: nowrap; }
.sub .w { color: var(--pink); }
.win { position: absolute; border-radius: 18px; border: 1px solid rgba(255,255,255,.09); background: #121214; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 80px rgba(240,120,155,.07); }
.bar { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #0f0f10; border-bottom: 1px solid #222226; font: 500 16px var(--ui); color: var(--muted); }
.dots { display: flex; gap: 8px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: #2c2c31; }
.card { position: absolute; border-radius: 20px; border: 1px solid var(--line2); background: #151517; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: #1f1f24; border: 1px solid var(--line2); font: 600 22px var(--ui); white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.msg { position: absolute; max-width: 760px; padding: 16px 22px; border-radius: 16px; font: 500 22px/1.55 var(--big); white-space: nowrap; }
.msg.me { background: rgba(240,120,155,.16); border: 1px solid rgba(240,120,155,.35); border-radius: 16px 16px 4px 16px; }
.msg.ai { background: #1c1c20; border: 1px solid var(--line2); border-radius: 16px 16px 16px 4px; }
.k { color: var(--pink); } .ok { color: var(--ok); } .mut { color: var(--muted); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 50px; padding: 0 26px; border-radius: 12px; font: 700 20px var(--big); white-space: nowrap; }
.cursor { position: absolute; width: 36px; height: 36px; z-index: 9; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.ripple { position: absolute; border-radius: 50%; border: 3px solid var(--pink); }
.girl { position: absolute; }
.diffl { display: flex; font: 20px/2 var(--mono); white-space: pre; }
.diffl .n { width: 60px; text-align: right; padding-right: 16px; color: #4d4d55; }
.diffl.del { background: rgba(239,107,107,.13); color: #f3a3a3; } .diffl.add { background: rgba(95,211,141,.12); color: #a6e8bf; }
.prog { height: 10px; border-radius: 999px; background: #232328; overflow: hidden; } .prog i { display: block; height: 100%; border-radius: 999px; }
.stamp { position: absolute; padding: 6px 16px; border: 3px solid var(--warn); border-radius: 10px; color: var(--warn); font: 800 30px var(--big); letter-spacing: .1em; }
.word { position: absolute; font: 900 120px/1 var(--big); letter-spacing: .02em; white-space: nowrap; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="glyph" width="1920" height="1080"></canvas>
<div id="stage"></div>
<div id="fx"></div>
<script>
// ---- timeline -------------------------------------------------------------------------
// Music: 120 BPM, so 1 beat = 0.5 s and 1 bar = 2 s. Every scene length is a whole number of bars,
// so every cut lands on a downbeat; the mixer trims the track's lead-in so its beat grid starts at 0.
const SCENES = [
  { id: "open", dur: 18, vo: 3.0, act: "", title: "sikeoop 4.1.58" },
  { id: "switch", dur: 16, vo: 1.0, act: "有用的", cls: "", title: "换模型，不用从头来" },
  { id: "fallback", dur: 16, vo: 1.0, act: "有用的", cls: "", title: "模型掉链子，自己顶上" },
  { id: "quota", dur: 16, vo: 1.0, act: "有用的", cls: "", title: "额度用完？它定个闹钟" },
  { id: "diff", dur: 18, vo: 1.0, act: "有用的", cls: "", title: "改什么先给你看 · 一键撤回" },
  { id: "dispatch", dur: 16, vo: 1.0, act: "迟早要用的", cls: "later", title: "调度台" },
  { id: "bookmark", dur: 18, vo: 1.0, act: "没用的", cls: "meh", title: "设置重做 · 侧栏改成书签" },
  { id: "soon", dur: 12, vo: 1.5, act: "还在做", cls: "soon", title: "预告：还在做" },
  { id: "end", dur: 20, vo: 4.0, act: "", title: "现在下载" },
];
// Narration (same text as script.json) and the measured length of each recorded line.
const LINES = {
  open: "杂鱼，醒醒。sikeoop 4.1.58 来了。这次本鲸攒了一大波：有用的，没用的，迟早要用的，全给你塞进去了。",
  switch: "先说有用的。中途换模型？之前读过的文件、做到哪一步，原样交给新模型，不用再读一遍。别家留下的老对话，也能接着聊。",
  fallback: "当前模型限流、欠费、断网了？排好的备用模型自动接手，同一步接着做。简单的问题，还能交给便宜模型，替你省钱。",
  quota: "额度用完了也别慌。本鲸读出几点重置，读不出就等五个小时，到点自动跟它说一句：继续。你睡你的，本鲸盯着。",
  diff: "改什么，先给你看。红的删、绿的加，再用大白话说为什么。你点同意它才写进去。改坏了？整轮一键撤回，不会 Git 也没关系。",
  dispatch: "一个 AI 不够用，就叫一群。派给 Claude Code、Codex 的活，全在调度台：看进度，验结果，一键取消。忙的排队，谁也别想打架。",
  bookmark: "然后是没用的。设置重做了，能搜能筛；侧栏收成一叠书签，鼠标一放就像扇子一样展开。用处嘛……主要是好看。",
  soon: "深度科研、论文工坊、PV 工坊、一键发布，还在做。做好了再告诉你，别催。",
  end: "有用的，没用的，迟早要用的，一个安装包全带走。去官网下载 sikeoop 4.1.58 吧。哼，才不是在等你呢。",
};
const VO_DUR = { open: 10.88, switch: 11.84, fallback: 11.04, quota: 9.76, diff: 10.72, dispatch: 10.72, bookmark: 12.64, soon: 7.2, end: 9.44 };
let acc = 0;
for (const s of SCENES) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
// Sound cues in scene-local seconds: [time, file, gain]. Mostly on the beat grid (multiples of 0.5).
const CUE = {
  open: [[0.0, "sparkle", 0.5], [2.0, "whoosh", 0.55], [4.0, "pop", 0.5], [5.0, "pop", 0.5], [6.0, "pop", 0.55], [8.0, "correct", 0.4]],
  switch: [[0.0, "whoosh", 0.5], [3.0, "click", 0.5], [4.0, "pop", 0.45], [5.5, "sparkle", 0.35], [8.0, "correct", 0.45]],
  fallback: [[0.0, "whoosh", 0.5], [3.0, "back", 0.55], [4.5, "pop", 0.5], [6.0, "correct", 0.45], [10.0, "pop", 0.4]],
  quota: [[0.0, "whoosh", 0.5], [2.0, "back", 0.45], [8.0, "alarm", 0.32], [9.5, "pop", 0.5]],
  diff: [[0.0, "whoosh", 0.5], [1.5, "typing", 0.25], [7.0, "click", 0.55], [7.5, "correct", 0.4], [11.0, "click", 0.55], [11.5, "back", 0.5]],
  dispatch: [[0.0, "whoosh", 0.5], [1.0, "pop", 0.4], [1.5, "pop", 0.4], [2.0, "pop", 0.4], [2.5, "pop", 0.4], [7.0, "correct", 0.4], [9.0, "click", 0.55], [9.5, "back", 0.45]],
  bookmark: [[0.0, "whoosh", 0.5], [2.0, "typing", 0.22], [8.0, "sparkle", 0.4], [8.5, "pop", 0.35], [9.0, "pop", 0.35], [9.5, "pop", 0.35]],
  soon: [[0.0, "whoosh", 0.5], [1.5, "pop", 0.45], [2.5, "pop", 0.45], [3.5, "pop", 0.45], [4.5, "pop", 0.45]],
  end: [[0.0, "sparkle", 0.55], [1.0, "pop", 0.5], [2.0, "pop", 0.5], [3.0, "pop", 0.55], [6.0, "whoosh", 0.4], [14.0, "correct", 0.45]],
};
// Typing loop is long; the mixer cuts each cue to this many seconds (default: the whole file).
const CUE_LEN = { typing: 2.0, alarm: 2.5 };
const cues = [];
for (const s of SCENES) for (const [t, file, gain] of CUE[s.id]) cues.push({ t: +(s.start + t).toFixed(3), file, gain, len: CUE_LEN[file] || 0 });
window.PV = { total: TOTAL, scenes: SCENES.map((s) => ({ id: s.id, start: s.start, dur: s.dur, vo: s.start + s.vo, title: s.title })), cues };

// ---- helpers ----------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (i, s = 0) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const typed = (str, k) => str.slice(0, Math.round(str.length * clamp(k)));
const pop = (t, a, d = 0.35) => back(seg(t, a, a + d));
const CURSOR = (x, y) => `<svg class="cursor" viewBox="0 0 24 24" style="left:${x}px;top:${y}px"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 18Z" fill="#f0789b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const ripple = (t, a, x, y) => { const r = seg(t, a, a + 0.5); return r > 0 && r < 1 ? `<div class="ripple" style="left:${x - 20 - r * 30}px;top:${y - 20 - r * 30}px;width:${40 + r * 60}px;height:${40 + r * 60}px;opacity:${1 - r}"></div>` : ""; };
const girl = (name, x, y, size, k = 1, flip = false) => `<div class="girl" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${clamp(k)};transform:translateY(${(1 - clamp(k)) * 40}px) scale(${flip ? -1 : 1},1)">${(window.SVGS || {})[name] || ""}</div>`;
const BEAT = 0.5;
const beatPulse = (gt) => Math.exp(-((gt % BEAT) / BEAT) * 5); // 1 on each beat, decaying

function chrome(sc, t) {
  const k = eo(seg(t, 0.1, 0.55));
  const out = 1 - seg(t, sc.dur - 0.35, sc.dur);
  let h = "";
  if (sc.act) h += `<div class="chip" style="opacity:${k * out};transform:translateX(${(1 - k) * -40}px)"><span class="act ${sc.cls || ""}">${sc.act}</span><b>${sc.title}</b></div>`;
  return h + subtitle(sc, t);
}
// Subtitles: the line split at sentence ends; each piece shown for a share of the recorded length
// proportional to its characters.
function subtitle(sc, t) {
  const parts = LINES[sc.id].match(/[^。？！：；]+[。？！：；]?/g).map((s) => s.trim()).filter(Boolean);
  const total = parts.reduce((a, p) => a + p.length, 0);
  const local = t - sc.vo;
  if (local < -0.15 || t > sc.dur - 0.2) return "";
  let acc2 = 0, idx = parts.length - 1;
  for (let i = 0; i < parts.length; i++) { acc2 += (parts[i].length / total) * VO_DUR[sc.id]; if (local < acc2) { idx = i; break; } }
  const fadeOut = local > VO_DUR[sc.id] + 0.8 ? 1 - seg(local, VO_DUR[sc.id] + 0.8, VO_DUR[sc.id] + 1.1) : 1;
  const a = clamp((local + 0.15) / 0.2) * fadeOut;
  if (a <= 0) return "";
  const html = parts[idx].replace(/[。；]$/, "").replace(/本鲸|杂鱼/g, (m) => `<span class="w">${m}</span>`);
  return `<div class="sub" style="opacity:${a}">${html}</div>`;
}
function appWin(x, y, w, h, title, inner, k = 1) {
  return `<div class="win" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${k};transform:translateY(${(1 - k) * 50}px) scale(${0.97 + 0.03 * k})">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span style="color:var(--pink)">♥</span><span style="color:var(--ink)">sikeoop</span><span>/</span><span>${title}</span><span style="margin-left:auto;font-family:var(--mono)">v4.1.58</span></div>
    <div style="position:absolute;top:46px;left:0;right:0;bottom:0">${inner}</div></div>`;
}

// ---- scenes -----------------------------------------------------------------------------
function sceneOpen(sc, t) {
  let h = "";
  // Wordmark locks in at 2.0 (on the bar), the three words stamp on beats 4/5/6, then slide up.
  const wk = eo(seg(t, 2.0, 2.6));
  const lift = eio(seg(t, 7.5, 8.5));
  const icon = window.SVGS && window.SVGS.icon ? window.SVGS.icon : "";
  h += `<div class="abs" style="left:50%;top:${lerp(330, 170, lift)}px;transform:translateX(-50%) scale(${lerp(0.9, 1, wk)});opacity:${wk};display:flex;align-items:center;gap:30px">
    <div style="width:120px;height:120px">${icon}</div>
    <div style="font:800 128px/1 var(--ui);letter-spacing:-.03em">sikeoop</div>
    <div style="font:600 54px/1 var(--mono);color:var(--pink);align-self:flex-end;margin-bottom:12px">4.1.58</div></div>`;
  const words = [["有用的", 4.0, "var(--ink)"], ["没用的", 5.0, "var(--ink2)"], ["迟早要用的", 6.0, "var(--pink)"]];
  let x = 960 - 820;
  words.forEach(([w, a, c], i) => {
    const k = pop(t, a, 0.4);
    const ww = w.length * 120 + 60;
    h += `<div class="word" style="left:${x}px;top:${lerp(560, 400, lift)}px;color:${c};opacity:${clamp(k)};transform:scale(${lerp(1.6, 1, clamp(seg(t, a, a + 0.3)))});transform-origin:50% 50%">${w}${i < 2 ? "，" : ""}</div>`;
    x += ww + (i === 0 ? 40 : 40);
  });
  const tag = eo(seg(t, 8.5, 9.2));
  h += `<div class="abs" style="left:50%;top:600px;transform:translateX(-50%);opacity:${tag};font:500 34px var(--big);color:var(--ink2);white-space:nowrap">给新手的 AI 代码编辑器 · <span class="k">都在这儿了</span></div>`;
  h += girl("work", 1380, 560, lerp(300, 380, eo(seg(t, 9, 10))), seg(t, 9.0, 9.6));
  if (t > 9) h += `<div class="msg ai" style="left:1070px;top:640px;opacity:${seg(t, 10, 10.4)};transform:scale(${clamp(pop(t, 10))})">看什么看，往下看啊，<span class="k">杂鱼</span>～</div>`;
  return h + chrome(sc, t);
}

function sceneSwitch(sc, t) {
  const k = eo(seg(t, 0.1, 0.7));
  const switched = t > 4.0;
  const model = switched ? "Claude" : "DeepSeek";
  const mcol = switched ? "#e8a27a" : "#7fb0e8";
  const files = ["src/App.jsx", "src/api/bill.js", "src/style.css", "package.json", "README.md", "src/utils/date.js"];
  let inner = `<div style="position:absolute;left:0;top:0;bottom:0;width:300px;background:#0f0f10;border-right:1px solid #222226;padding:22px;font:18px/2.2 var(--mono);color:var(--muted)">
    <div style="font:600 16px var(--ui);color:var(--ink2);margin-bottom:8px">已读文件</div>
    ${files.map((f, i) => `<div style="opacity:${seg(t, 0.6 + i * 0.15, 0.9 + i * 0.15)}"><span class="ok">✓</span> ${f}</div>`).join("")}</div>`;
  inner += `<div class="msg me" style="left:360px;top:40px">帮我把记账本加上按月统计</div>`;
  inner += `<div class="msg ai" style="left:360px;top:130px;opacity:${seg(t, 0.8, 1.2)}">读完 6 个文件，第 3 步：写统计函数……</div>`;
  // model switcher
  const open = t > 2.6 && t < 4.0;
  inner += `<div class="abs" style="left:360px;bottom:34px;right:34px;height:70px;border-radius:16px;background:#1c1c20;border:1px solid var(--line2);display:flex;align-items:center;padding:0 18px;gap:14px;font:20px var(--big);color:var(--muted)">
    <span class="pill" style="font-size:19px;border-color:${mcol}"><span class="dot" style="background:${mcol}"></span>${model}</span> 继续做……</div>`;
  if (open) inner += `<div class="card" style="left:360px;bottom:116px;width:300px;padding:10px;opacity:${seg(t, 2.6, 2.8)}">
    ${["DeepSeek", "通义千问", "Kimi", "Claude", "小米 MiMo"].map((m) => `<div style="padding:10px 16px;border-radius:10px;font:600 20px var(--ui);${m === "Claude" && t > 3.0 ? "background:rgba(240,120,155,.2);color:var(--ink)" : "color:var(--ink2)"}">${m}</div>`).join("")}</div>`;
  if (open) inner += CURSOR(500, t > 3.0 ? 480 : lerp(560, 480, seg(t, 2.6, 3.0))) + ripple(t, 3.0, 510, 490);
  // hand-off packet
  const fly = eio(seg(t, 4.2, 5.5));
  if (t > 4.0) inner += `<div class="card" style="left:${lerp(60, 760, fly)}px;top:${lerp(380, 250, fly)}px;width:520px;padding:22px 26px;border-color:rgba(240,120,155,.55);opacity:${seg(t, 4.0, 4.3)}">
      <div style="font:700 24px var(--big)">📦 交接记录</div>
      <div style="font:18px/1.9 var(--mono);color:var(--ink2);margin-top:8px">已读文件 × 6 · 做到第 3 步<br>上一位：DeepSeek → 接手：Claude</div></div>`;
  if (t > 5.5) inner += `<div class="msg ai" style="left:760px;top:440px;opacity:${seg(t, 5.6, 6.0)};border-color:rgba(232,162,122,.5)"><b style="color:#e8a27a">Claude</b>：收到交接，从第 3 步接着写。</div>`;
  if (t > 7.5) inner += `<div class="abs" style="left:760px;top:540px;opacity:${seg(t, 7.5, 7.9)};transform:scale(${clamp(pop(t, 8.0))});transform-origin:0 50%;font:800 44px var(--big)">重读文件：<span class="ok" style="font-family:var(--mono)">0</span> 个</div>`;
  if (t > 10.0) inner += `<div class="pill" style="position:absolute;left:760px;top:620px;opacity:${seg(t, 10, 10.4)};font-size:20px">🗂 打开别家留下的老对话 → <span class="k">接着聊</span></div>`;
  return appWin(160, 180, 1600, 790, "记账本", inner, k) + chrome(sc, t);
}

function modelCard(x, y, name, sub, state, k = 1) {
  const col = { run: "var(--ok)", down: "var(--bad)", idle: "var(--muted)", warm: "var(--warn)" }[state];
  return `<div class="card" style="left:${x}px;top:${y}px;width:440px;height:200px;padding:30px 34px;opacity:${k};border-color:${state === "down" ? "rgba(239,107,107,.6)" : state === "run" ? "rgba(95,211,141,.5)" : "var(--line2)"}">

function drawGlyphs(t) {

    const y = ((hash(i, 3) * 1080 + t * sp) % 1180) - 50;
    const a = (0.08 + 0.3 * hash(i, 4)) * dens;
    gctx.fillStyle = hash(i, 5) > 0.85 ? `rgba(240,120,155,${a * 1.6})` : `rgba(200,200,215,${a})`;
    gctx.fillText(GLYPHS[Math.floor(hash(i, Math.floor(t * 6 + i)) * GLYPHS.length)], x, y);
  }
}
function transitionFx(t) {
  // A short pink wipe on every cut (cuts are on downbeats).
  for (const s of SCENES) {
    if (s.start === 0) continue;
    const d = t - s.start;
    if (d > -0.25 && d < 0.25) {
      const k = (d + 0.25) / 0.5;
      return `<div class="abs" style="inset:0;background:linear-gradient(100deg,transparent ${lerp(-40, 100, k) - 20}%,rgba(240,120,155,.35) ${lerp(-40, 100, k)}%,transparent ${lerp(-40, 100, k) + 20}%)"></div>`;
    }
  }
  return "";
}

window.renderAt = (t) => {
  let sc = SCENES[SCENES.length - 1];
  for (const s of SCENES) if (t >= s.start && t < s.start + s.dur) { sc = s; break; }
  const lt = t - sc.start;
  const bg = document.getElementById("bg");
  bg.style.setProperty("--gx", `${60 + 15 * Math.sin(t * 0.21)}%`);
  bg.style.setProperty("--gy", `${22 + 10 * Math.cos(t * 0.17)}%`);
  drawGlyphs(t);
  const scOut = SCENES.find((s) => s.id === sc.id);
  document.getElementById("stage").innerHTML = RENDER[sc.id](scOut, lt);
  document.getElementById("fx").innerHTML = transitionFx(t);
};
window.boot = () => {
  Promise.all([document.fonts.load("22px GeistMono"), document.fonts.load("20px Geist")]).then(() => document.fonts.ready).then(() => { window.PV.ready = true; renderAt(0); });
};
</script>
